# Workflow：Android demo 冒烟（基于 quickstart/templates/android-gradle.yml）
# =============================================================================
# 冒烟期临时配置：job 级代理走 Windows 172.16.0.81:7890（依赖下载用，
# 生产切内网白名单后删除下面 env 块即可）。
# =============================================================================

name: Android CI (Gradle)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [macos, arm64, macrunara]

    env:
      # --- 冒烟期临时：依赖下载走 Windows 代理 ---
      http_proxy: http://172.16.0.81:7890
      https_proxy: http://172.16.0.81:7890
      # Gradle Wrapper 下载发行版 + 拉依赖走 JVM 系统属性（不读 env 代理）
      GRADLE_OPTS: -Dhttp.proxyHost=172.16.0.81 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=172.16.0.81 -Dhttps.proxyPort=7890

    steps:
      - uses: actions/checkout@v4

      # 可选：Macrunara Setup Action（需仓库 Secrets 配 MACRUNARA_INSTALLATION_ID；
      # 没配就删掉这个 step，不影响构建）
      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"

      - name: Build & Upload
        uses: macrunara/build-actions/android@v1
        with:
          task: assembleDebug
          module: app
          upload_artifact: true
          artifact_name: android-debug-apk
          artifact_path: app/build/outputs/
