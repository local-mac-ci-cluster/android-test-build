# Workflow: Android demo — 验证 quickstart/templates/android-gradle.yml 新版（纯 run: 形态）
# 变更：移除 macrunara/setup-action 与 build-actions（已放弃、仓库已私有），
# 改为模板纯 run: 构建命令。
name: Android CI (Gradle)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [macos, arm64, macrunara]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v5

      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<not set>}"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/
