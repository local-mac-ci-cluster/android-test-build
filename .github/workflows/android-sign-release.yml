# Workflow：Android 签名构建冒烟（V1.1-2.1 签名链路验证）
# 2026-11-24 重写：原 macrunara/setup-action + build-actions/android 已随 Action
# 产品线放弃转私有，改为纯 run: 直调仓库内置脚本（.ci/scripts/，与原 Action
# 同源）：keystore 经 Gradle init.d 零侵入注入 release 签名，客户 build.gradle 无需改动。
# 仅手动触发，不影响现有 android-gradle.yml 的 Debug CI。
# 前置：仓库 Secrets 已配 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

name: Android Sign Release

on:
  workflow_dispatch:

jobs:
  build-sign-release:
    runs-on: [macos, arm64, macrunara]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      # 预装环境导出：ANDROID_HOME / platform-tools 写入 $GITHUB_ENV 与 $GITHUB_PATH，
      # JDK 17 由节点镜像预装，仅补 JAVA_HOME
      - name: Export preinstalled environment
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          fi
          if [ -z "${JAVA_HOME:-}" ] && /usr/libexec/java_home -v 17 >/dev/null 2>&1; then
            echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      # 签名材料先打码
      - name: Mask signing secrets
        run: |
          echo "::add-mask::${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          echo "::add-mask::${{ secrets.ANDROID_KEY_PASSWORD }}"
          echo "::add-mask::${{ secrets.ANDROID_KEYSTORE_BASE64 }}"

      # keystore 解码 + init.d 零侵入签名注入；密码只经环境变量传给 Gradle 进程
      - name: Setup Android signing
        run: |
          ENV_FILE="${RUNNER_TEMP}/android-signing.env"
          bash .ci/scripts/setup-android-signing.sh \
            "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "$ENV_FILE"
          cat "$ENV_FILE" >> "$GITHUB_ENV"

      # build.sh 内含：代理转 JVM 属性 + 钉 LTS JDK + maven 镜像注入 + gradlew
      - name: Gradle build (assembleRelease)
        run: bash .ci/scripts/build.sh "assembleRelease" "app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-signed-apk
          path: app/build/outputs/
          if-no-files-found: warn

      - name: Verify signature
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          # 节点装有多个 build-tools 版本，glob 会展开成多个路径，取最新一个
          APKSIGNER=$(ls -d "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | head -5
