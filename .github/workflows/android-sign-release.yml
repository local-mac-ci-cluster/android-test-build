# Workflow：Android 签名构建冒烟（V1.1-2.1 签名链路验证）
# 仅手动触发，不影响现有 android-gradle.yml 的 Debug CI。
# 前置：仓库 Secrets 已配 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

name: Android Sign Release

on:
  workflow_dispatch:

jobs:
  build-sign-release:
    runs-on: [macos, arm64, macrunara]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      - name: Build Signed Release & Upload
        uses: macrunara/build-actions/android@46d8bd1dfa108ffb00db06e0b07e41f2906d6297  # v1 (maven mirrors)
        with:
          task: assembleRelease
          module: app
          sign_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          upload_artifact: true
          artifact_name: android-release-signed-apk
          artifact_path: app/build/outputs/

      - name: Verify signature
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          # 节点装有多个 build-tools 版本，glob 会展开成多个路径，取最新一个
          APKSIGNER=$(ls -d "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | head -5
